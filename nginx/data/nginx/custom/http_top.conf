geoip2 /geoip/GeoLite2-Country.mmdb {
    $geoip2_data_country_iso_code country iso_code;
}

map $geoip2_data_country_iso_code $allowed_country {
  default 1;          # allow everyone by default...

  # Block high spam/bot countries
  RU 0;   # Russia
  CN 0;   # China
  HK 0;   # Hong Kong
  KP 0;   # North Korea
  BY 0;   # Belarus
  IR 0;   # Iran
  RO 0;   # Romania
  BG 0;   # Bulgaria
  MD 0;   # Moldova
  RS 0;   # Serbia
  ID 0;   # Indonesia
  VN 0;   # Vietnam
  PK 0;   # Pakistan
  BD 0;   # Bangladesh
  TH 0;   # Thailand
  PH 0;   # Philippines
  IN 0;   # India
}